spring.datasource.url=jdbc:h2:mem:ibot;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
mybatis.configuration.map-underscore-to-camel-case=true

spring.data.mongodb.uri=mongodb://localhost:27017/ibot-test
spring.data.mongodb.auto-index-creation=true

langchain4j.community.dashscope.chat-model.api-key=test-chat-key
langchain4j.community.dashscope.chat-model.model-name=qwen-max
langchain4j.community.dashscope.chat-model.base-url=https://dashscope.aliyuncs.com/api/v1

ibot.rag.embedding.api-key=test-embedding-key
ibot.rag.embedding.base-url=https://dashscope.aliyuncs.com/api/v1
ibot.rag.embedding.model-name=text-embedding-v4
ibot.auth.jwt.secret=test-secret-key-test-secret-key-test-secret-key
ibot.auth.jwt.expire-hours=24
ibot.auth.seed-admin.email=admin@test.local
ibot.auth.seed-admin.display-name=Test Admin
ibot.auth.seed-admin.password=Admin@123456
ibot.security.crypto-secret=test-crypto-secret-test-crypto-secret

ibot.rag.pinecone.enabled=false
ibot.rag.default-knowledge-base=default
ibot.rag.retrieval.max-results=3
ibot.rag.retrieval.min-score=0.6
